      : `<p class="muted" style="margin:0 0 12px">Analiza las cartas de tu equipo y del rival, sugiere la formación y la pone en la pizarra.</p><button class="btn primary" type="button" data-act="tip-ask">${ic("bolt")}Pedir sugerencia</button>`}</section>`;
}

/* ================= calendario ================= */
const MONTHS = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, oct: 9, nov: 10, dic: 11 };
function matchDate(m) {
  const now = new Date(); let y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
  const md = /(\d{1,2})\s+([a-zé]{3})/i.exec(m.day || "");
  if (md && MONTHS[md[2].toLowerCase()] !== undefined) { d = +md[1]; mo = MONTHS[md[2].toLowerCase()]; if (mo < now.getMonth() - 1) y++; }
  const tm = /(\d{1,2}):(\d{2})\s*([ap])/i.exec(m.time || ""); let hh = 20, mm = 0; if (tm) { hh = (+tm[1] % 12) + (tm[3].toLowerCase() === "p" ? 12 : 0); mm = +tm[2]; }
  const start = new Date(Date.UTC(y, mo, d, hh + 5, mm)), end = new Date(start.getTime() + (m.mode === "F11" ? 90 : 60) * 60000);
  return { start, end };
}
function calLinks(m) {
  const { start, end } = matchDate(m), z = dt => dt.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const title = `${m.title} · GoalMatch`, loc = `${m.venue}, ${m.zone}, ${m.city}`, det = `${MODE_NAME[m.mode]}. Llega 30 minutos antes.`;
  const g = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${z(start)}/${z(end)}&location=${encodeURIComponent(loc)}&details=${encodeURIComponent(det)}`;
  const o = `https://outlook.live.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(title)}&startdt=${encodeURIComponent(start.toISOString())}&enddt=${encodeURIComponent(end.toISOString())}&location=${encodeURIComponent(loc)}&body=${encodeURIComponent(det)}`;
  return `<a class="btn sm" href="${g}" target="_blank" rel="noopener">${ic("calendar")}Google Calendar</a><a class="btn sm" href="${o}" target="_blank" rel="noopener">${ic("calendar")}Outlook</a>`;
}
function matchTools(m) {
  return `<section class="card"><div class="card-head"><h2>Herramientas del partido</h2></div><div class="row wrap">
    <a class="btn primary" href="#vivo-${m.id}">${ic("play")}Marcador en vivo</a>
    <a class="btn" href="#notas-${m.id}">${ic("star")}Notas entre compañeros</a>
    ${m.id === "m1" ? `<a class="btn" href="#pizarra" data-act="board-from" data-match="m1">${ic("bolt")}Asistente táctico</a>` : ""}
    ${calLinks(m)}</div></section>`;
}

/* ================= modo claro ================= */
state.light = (() => { try { return localStorage.getItem("gm-mode") === "light"; } catch (e) { return false; } })();
function applyMode() { document.documentElement.dataset.mode = state.light ? "light" : "dark"; const tc = $('meta[name="theme-color"]'); if (tc) tc.content = state.light ? "#f3f6f2" : "#07130f"; }
applyMode();

/* ================= acciones v4 ================= */
Object.assign(ACTIONS, {
  referee() { state.referee = !state.referee; rerender(); },
  clock(el) {
    const id = el.dataset.match, c = Object.assign({}, getLive(id).clock), now = Date.now();
    if (el.dataset.op === "start") Object.assign(c, { running: true, startedAt: now, elapsed: 0, status: "en juego" });
    if (el.dataset.op === "pause") Object.assign(c, { running: false, elapsed: c.elapsed + (now - c.startedAt) });
    if (el.dataset.op === "resume") Object.assign(c, { running: true, startedAt: now });
    if (el.dataset.op === "end") Object.assign(c, { running: false, elapsed: c.elapsed + (c.running ? now - c.startedAt : 0), status: "final" });
    if (el.dataset.op === "reset") { Object.assign(c, defClock()); if (!cloud.ready) getLive(id).events = []; }
    setClock(id, c);
  },
  "ev-open"(el) { evModal(el.dataset.match, el.dataset.team, el.dataset.type); },
  "ev-undo"(el) {
    const id = el.dataset.match, L = getLive(id), mine = L.events.filter(e => e.uid === (cloud.uid || "local")).sort((a, b) => b.ts - a.ts)[0];
    if (!mine) { toast("Solo puedes deshacer jugadas que registraste tú."); return; }
    if (cloud.ready && cloud.uid) cloud.db.doc("live/" + id + "/events/" + mine.id).delete().catch(() => toast("No se pudo deshacer."));
    else L.events = L.events.filter(e => e !== mine);
    rerender();
  },
  "rate-send"(el) {
    const id = el.dataset.match; state.ratings[id] = Object.assign({}, state.ratingDraft[id]);
    try { localStorage.setItem("gm-ratings", JSON.stringify(state.ratings)); } catch (e) { }
    cloudWrite("ratings/" + cloud.uid, { byMatch: state.ratings, ts: Date.now() });
    rerender(); toast("Notas enviadas. Gracias por calificar.");
  },
  "nota-apply"(el) {
    const id = el.dataset.match, delta = +el.dataset.delta; if (state.notaApplied[id]) return;
    const keys = GROUP_ATTRS[GROUP[state.profile.pos] || "med"]; keys.forEach(k => { state.profile.attrs[k] = clamp(state.profile.attrs[k] + delta, 1, 99); });
    const before = PLAYERS.me.ovr; syncMe(); saveProfile(); state.notaApplied[id] = true; if (cloud.uid && cloud.players[cloud.uid]) pushProfile();
    rerender(); toast(`Tu media pasó de ${before} a ${PLAYERS.me.ovr}`);
  },
  "board-type"(el) { state.board2.type = el.dataset.val; rerender(); },
  "post-open"() {
    openModal(`<div class="row between"><h2>Publicar aviso</h2><button class="icon-btn" type="button" data-act="close-modal" aria-label="Cerrar">${ic("x")}</button></div>
    <form id="postForm" class="stack" style="gap:12px;margin-top:12px">
      <div class="seg" role="radiogroup" aria-label="Tipo"><label class="toggle" style="padding:6px 10px"><input type="radio" name="ptype" value="jugador" checked>Mi club busca jugador</label><label class="toggle" style="padding:6px 10px"><input type="radio" name="ptype" value="equipo">Busco equipo</label></div>
      <div class="grid g-2" style="gap:12px"><div class="field"><label for="pPos">Posición</label><select id="pPos" class="input"><option value="Cualquiera">Cualquiera</option>${POSITIONS.map(([k, n]) => `<option value="${k}">${k} · ${n}</option>`).join("")}</select></div><div class="field"><label for="pMode">Modalidad</label><select id="pMode" class="input"><option>F5</option><option>F7</option><option>F11</option></select></div></div>
      <div class="grid g-2" style="gap:12px"><div class="field"><label for="pZone">${state.city === "Medellín" ? "Comuna" : "Localidad"} (${state.city})</label><select id="pZone" class="input">${cityZones().map(z => `<option>${z}</option>`).join("")}</select></div><div class="field"><label for="pWhen">Cuándo</label><input id="pWhen" class="input" maxlength="50" placeholder="Ej. Jue 19 nov · 8:00 p. m."></div></div>
      <div class="field"><label for="pText">Mensaje</label><textarea id="pText" class="input" maxlength="200" required placeholder="Ej. Necesitamos un central para el reto del domingo."></textarea></div>
      <p class="err" id="postErr" role="alert"></p><button class="btn primary" type="submit">${ic("check")}Publicar</button></form>`);
  },
  "post-apply"(el) {
    const id = el.dataset.id; state.applied[id] = true;
    if (cloud.ready && cloud.canWrite && cloud.uid) cloudWrite("apps/" + id.replace(/[^\w-]/g, "") + "__" + cloud.uid, { post: id, uid: cloud.uid, ts: Date.now() });
    rerender(); toast("Listo: le llegó tu carta al club.");
  },
  "post-del"(el) {
    const id = el.dataset.id;
    state.localPosts = state.localPosts.filter(p => p.id !== id);
    if (cloud.ready && cloud.uid && (cloud.board || []).some(p => p.id === id && p.uid === cloud.uid)) cloud.db.doc("board/" + id).delete().catch(() => toast("No se pudo borrar."));
    rerender();
  },
  "rank-sort"(el) { state.rank.sort = el.dataset.val; rerender(); },
  "goal-vote"(el) { const id = el.dataset.id; state.goalVote = id; cloudWrite("goalvotes/" + cloud.uid, { goal: id, ts: Date.now() }); rerender(); toast("Voto registrado"); },
  "tip-ask"() { askTip(); },
  "mode-toggle"() { state.light = !state.light; try { localStorage.setItem("gm-mode", state.light ? "light" : "dark"); } catch (e) { } applyMode(); renderChrome(); markNav(currentView()); }
});
document.addEventListener("input", e => { const t = e.target; if (t.dataset.rate) { state.ratingDraft[t.dataset.match][t.dataset.rate] = +t.value; const v = $("#rv-" + t.dataset.rate); if (v) v.textContent = (+t.value).toFixed(1); } });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.hasAttribute("data-board-pos")) { state.board2.pos = t.value; rerender(); }
  if (t.dataset.rank === "zone") { state.rank.zone = t.value; rerender(); }
});
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "evForm") {
    const id = f.dataset.match, type = f.dataset.type === "tarjeta" ? (f.querySelector("input[name=card]:checked") || {}).value || "amarilla" : f.dataset.type;
    const ev = { type, team: f.dataset.team, player: $("#evPlayer").value, assist: type === "gol" ? ($("#evAssist").value || "") : "", sub: type === "cambio" ? ($("#evSub").value || "").trim().slice(0, 30) : "" };
    if (ev.assist && ev.assist === ev.player) { toast("El goleador no puede darse la asistencia a sí mismo."); return; }
    addEvent(id, ev); closeModal(); rerender(); toast(type === "gol" ? "¡Gooool registrado!" : "Jugada registrada");
  }
  if (f.id === "postForm") {
    const text = $("#pText").value.trim(); if (text.length < 8) { $("#postErr").textContent = "Escribe un mensaje un poco más largo."; return; }
    const post = { type: (f.querySelector("input[name=ptype]:checked") || {}).value || "jugador", pos: $("#pPos").value, mode: $("#pMode").value, city: state.city, zone: $("#pZone").value, when: $("#pWhen").value.trim().slice(0, 50), text: text.slice(0, 200), ts: Date.now() };
    if (cloud.ready && cloud.canWrite && cloud.uid) { post.uid = cloud.uid; const ok = await cloudWrite("board/" + cloud.uid.slice(0, 20) + "-" + Date.now().toString(36), post); if (!ok) { $("#postErr").textContent = "No se pudo publicar. Revisa tu permiso de colaborador."; return; } }
    else state.localPosts.unshift(Object.assign({ id: "l" + Date.now(), uid: "local", base: 0, real: false, author: PLAYERS.me.name }, post));
    closeModal(); rerender(); toast("Aviso publicado");
  }
  if (f.id === "goalForm") {
    const file = $("#goalFile").files[0], cap = $("#goalCap").value.trim().slice(0, 120), err = $("#goalErr");
    if (!file) { err.textContent = "Elige una foto o un video."; return; }
    if (file.size > 20 * 1024 * 1024) { err.textContent = "El archivo pasa de 20 MB. Recórtalo o comprímelo."; return; }
    const kind = file.type.startsWith("video/") ? "video" : "image";
    if (!["image/jpeg", "image/png", "image/webp", "image/gif", "video/mp4", "video/webm"].includes(file.type)) { err.textContent = "Usa JPG, PNG, WebP, GIF, MP4 o WebM."; return; }
    if (cloud.assets && cloud.ready && cloud.uid) {
      err.textContent = ""; f.querySelector("button").disabled = true; f.querySelector("button").textContent = "Subiendo…";
      try { const up = await cloud.assets.upload(file); await cloudWrite("goals/" + up.id, { asset: up.id, kind, caption: cap, city: state.city, uid: cloud.uid, ts: Date.now() }); state.myGoalUploads++; toast("¡Gol publicado en la galería!"); }
      catch (x) { err.textContent = x && x.code === "too_large" ? "El archivo es muy grande." : x && x.code === "quota_or_state" ? "La galería está llena. Avísale al dueño de la app." : "No se pudo subir. Intenta de nuevo."; }
      rerender(); return;
    }
    state.localGoals.unshift({ id: "lg" + Date.now(), local: true, url: URL.createObjectURL(file), kind, caption: cap, city: state.city, base: 0 }); state.myGoalUploads++;
    rerender(); toast("Gol agregado en este dispositivo");
  }
});

applyMvpBoost();
render();
initCloud();
</script>
