<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07130f">
<title>GoalMatch · Demo</title>
<meta name="description" content="GoalMatch: comunidad de fútbol amateur en Bogotá y Medellín. Demo interactiva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: barra superior fija + menú lateral en web, barra de pestañas inferior en móvil; contenido en rejilla que colapsa a una columna */
  color-scheme: dark;
  --bg: #07130f;
  --panel: #0c1b15;
  --raised: #10231a;
  --raised-2: #163024;
  --line: rgba(218, 241, 225, .09);
  --line-2: rgba(218, 241, 225, .17);
  --text: #eef5f0;
  --muted: #91a399;
  --dim: #6f8377;
  --accent: #c5f36b;
  --accent-ink: #15210a;
  --gold: #e9c46a;
  --danger: #ff7a6b;
  --info: #7cc8f0;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --top: 64px;
  --side: 256px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.ic { width: 18px; height: 18px; flex: 0 0 auto; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--display); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- estructura ---------- */
.topbar { position: fixed; z-index: 40; inset: 0 0 auto; height: var(--top); display: flex; align-items: center; gap: 14px; padding: 0 20px; background: rgba(7, 19, 15, .94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
.brand-mark svg { width: 21px; height: 21px; }
.brand-name { font-family: var(--display); font-size: 21px; font-weight: 800; letter-spacing: .1em; }
.brand-name span { color: var(--accent); }
.top-search { flex: 1; max-width: 420px; margin-left: 34px; position: relative; }
.top-search input { width: 100%; height: 38px; padding: 0 12px 0 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.top-search .ic { position: absolute; left: 12px; top: 10px; color: var(--muted); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.icon-btn:hover { border-color: var(--line-2); }
.dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); }
.me-chip { display: flex; align-items: center; gap: 9px; padding: 4px 12px 4px 4px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); text-decoration: none; }
.me-chip b { font-family: var(--display); font-size: 16px; color: var(--accent); }
.avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--raised-2); font-size: 11px; font-weight: 800; letter-spacing: .03em; color: var(--accent); flex: 0 0 auto; }
.menu-btn { display: none; }

.sidebar { position: fixed; z-index: 30; top: var(--top); bottom: 0; left: 0; width: var(--side); overflow-y: auto; padding: 18px 12px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: #2a4033 transparent; }
.nav-group { margin-bottom: 16px; }
.nav-title { margin: 0 10px 6px; color: var(--dim); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.nav-link { display: flex; align-items: center; gap: 11px; min-height: 38px; padding: 7px 10px; border-radius: 9px; border: 1px solid transparent; color: #a7b5ac; text-decoration: none; font-size: 13px; font-weight: 600; }
.nav-link:hover { background: rgba(255, 255, 255, .04); color: var(--text); }
.nav-link.active { background: rgba(197, 243, 107, .09); border-color: rgba(197, 243, 107, .16); color: var(--accent); }
.nav-badge { margin-left: auto; padding: 2px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 800; }
.side-next { margin-top: auto; padding: 14px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); font-size: 12px; }
.side-next strong { display: block; margin: 4px 0 2px; font-family: var(--display); font-size: 18px; letter-spacing: .02em; }
.scrim { display: none; }

.main { margin-left: var(--side); padding: calc(var(--top) + 26px) 28px 48px; min-height: 100%; }
.view { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.tabbar { display: none; }

/* ---------- piezas comunes ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.page-head h1 { font-family: var(--display); font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: .01em; margin-top: 6px; }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-head h2 { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.link { color: var(--accent); font-size: 12px; font-weight: 700; text-decoration: none; background: none; border: 0; padding: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--raised); color: var(--text); font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: rgba(197, 243, 107, .4); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.sm { height: 32px; padding: 0 11px; font-size: 12px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; background: var(--raised-2); color: #c9d6cd; font-size: 11px; font-weight: 700; white-space: nowrap; }
.chip.accent { background: rgba(197, 243, 107, .14); color: var(--accent); }
.chip.gold { background: rgba(233, 196, 106, .15); color: var(--gold); }
.chip.info { background: rgba(124, 200, 240, .14); color: var(--info); }
.chip.danger { background: rgba(255, 122, 107, .14); color: var(--danger); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); }
.seg button { height: 32px; padding: 0 13px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 700; font-size: 12px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.grid { display: grid; gap: 18px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 700; color: #c4d1c8; }
.input, select.input, textarea.input { width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); }
textarea.input { height: 84px; padding: 10px 12px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); }
.hint { font-size: 11px; color: var(--muted); }
.err { font-size: 12px; color: var(--danger); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.tile span { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.tile b { display: block; margin-top: 2px; font-family: var(--display); font-size: clamp(22px, 2.4vw + 10px, 32px); overflow-wrap: anywhere; font-weight: 800; line-height: 1; }
.tile small { color: var(--accent); font-weight: 700; font-size: 11px; }
.bar { height: 6px; border-radius: 99px; background: var(--raised-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.empty { padding: 34px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--r); }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: rgba(124, 200, 240, .08); border: 1px solid rgba(124, 200, 240, .2); color: #cde9f7; font-size: 12px; }

/* ---------- carta FUT ---------- */
.fut { --w: 190px; position: relative; flex: 0 0 auto; width: var(--w); aspect-ratio: 200 / 292; font-size: calc(var(--w) * .08); padding: .9em .95em 0; display: flex; flex-direction: column; color: var(--card-ink); background: var(--card-bg); clip-path: polygon(11% 0, 89% 0, 100% 5.5%, 100% 86%, 50% 100%, 0 86%, 0 5.5%); font-family: var(--display); isolation: isolate; }
.fut::before { content: ""; position: absolute; inset: .32em; clip-path: polygon(11% 0, 89% 0, 100% 5.5%, 100% 86%, 50% 100%, 0 86%, 0 5.5%); border: 1.5px solid var(--card-edge); opacity: .55; z-index: -1; }
.fut.sm { --w: 118px; } .fut.md { --w: 170px; } .fut.lg { --w: 220px; } .fut.xl { --w: 250px; }
.tier-elite { --card-bg: linear-gradient(162deg, #224a2a 0%, #0d1f14 52%, #050c08 100%); --card-ink: #ecffd0; --card-edge: #c5f36b; --num-ink: #0d1f14; }
.tier-oro { --card-bg: linear-gradient(162deg, #f7e6a8 0%, #dcb65e 48%, #a37c2b 100%); --card-ink: #2b2107; --card-edge: #fff4cc; --num-ink: #e9cf83; }
.tier-plata { --card-bg: linear-gradient(162deg, #e8edeb 0%, #aeb9b4 52%, #79857f 100%); --card-ink: #19211e; --card-edge: #ffffff; --num-ink: #c9d2ce; }
.fut.figura { --card-bg: radial-gradient(120% 80% at 70% 18%, rgba(197, 243, 107, .45), transparent 55%), linear-gradient(165deg, #2b5112 0%, #0b1708 45%, #12240a 72%, #9fd14a 135%); --card-ink: #f3ffdc; --card-edge: #e6ffad; --num-ink: #13260b; }
.fut.figura::after { content: ""; position: absolute; inset: 0; background: linear-gradient(112deg, transparent 32%, rgba(255, 255, 255, .42) 45%, rgba(197, 243, 107, .3) 51%, transparent 64%); background-size: 260% 100%; background-position: 150% 0; mix-blend-mode: screen; pointer-events: none; animation: holo 3.4s ease-in-out infinite; }
.fut-meta { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 2.6em; line-height: .92; }
.fut-ovr { font-size: 2.55em; font-weight: 800; }
.fut-pos { font-size: 1.05em; font-weight: 700; letter-spacing: .04em; }
.fut-flag { margin-top: .35em; width: 1.5em; height: 1em; border-radius: 2px; background: linear-gradient(#fcd116 0 50%, #003893 50% 75%, #ce1126 75%); box-shadow: 0 0 0 1px rgba(0, 0, 0, .15); }
.fut-club { margin-top: .35em; }
.fut-art { position: absolute; right: 7%; top: 6%; width: 64%; aspect-ratio: 1; }
.fut-art svg { width: 100%; height: 100%; }
.fut-name { margin-top: auto; padding: 0 .2em .18em; text-align: center; font-size: 1.32em; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid color-mix(in srgb, currentColor 28%, transparent); }
.fut-stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.1em; padding: .38em .5em 2.15em; font-size: .98em; font-weight: 600; letter-spacing: .03em; }
.fut-stats div { display: flex; gap: .35em; white-space: nowrap; }
.fut-stats b { font-weight: 800; min-width: 1.25em; text-align: right; }
@keyframes holo { 0% { background-position: 150% 0; } 55%, 100% { background-position: -60% 0; } }

/* ---------- figuras: animación del mejor jugador por equipo ---------- */
.spot { position: relative; overflow: hidden; border-radius: 18px; border: 1px solid rgba(197, 243, 107, .2); background: radial-gradient(80% 120% at 50% 0%, rgba(197, 243, 107, .1), transparent 60%), linear-gradient(180deg, #0d2116, #08150f); padding: 20px 20px 22px; }
.spot-head { position: relative; z-index: 2; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
.spot-head h2 { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: .02em; line-height: 1.05; margin-top: 4px; }
.spot-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.spot-stage { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; margin-top: 8px; }
.spot-side { position: relative; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 14px; }
.spot-rays { position: absolute; z-index: 0; left: 50%; top: 42%; width: 420px; height: 420px; transform: translate(-50%, -50%); border-radius: 50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--team) 40%, transparent) 0deg 7deg, transparent 7deg 20deg); -webkit-mask: radial-gradient(circle, #000 0 18%, transparent 64%); mask: radial-gradient(circle, #000 0 18%, transparent 64%); opacity: .5; animation: spin 22s linear infinite; pointer-events: none; }
.side-right .spot-rays { animation-direction: reverse; }
.spot-glow { position: absolute; z-index: 0; left: 50%; top: 42%; width: 240px; height: 240px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--team) 55%, transparent), transparent 70%); filter: blur(12px); animation: breathe 3.2s ease-in-out infinite; pointer-events: none; }
.spot-particles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.spot-particles i { position: absolute; bottom: 22%; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; background: var(--team); box-shadow: 0 0 8px var(--team); opacity: 0; animation: rise var(--d) linear var(--dl) infinite; }
.spot-card { position: relative; z-index: 2; perspective: 900px; }
.spot-float { animation: float 4.2s ease-in-out infinite; filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .55)) drop-shadow(0 0 22px color-mix(in srgb, var(--team) 45%, transparent)); }
.side-right .spot-float { animation-delay: -2.1s; }
.spot.play .spot-card { animation: cardRise 1.15s cubic-bezier(.16, 1, .3, 1) both; }
.spot.play .side-right .spot-card { animation-delay: .28s; }
.figura-badge { position: absolute; z-index: 3; top: -12px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 6px 18px rgba(197, 243, 107, .35); }
.figura-badge .ic { width: 13px; height: 13px; }
.spot.play .figura-badge { animation: badgePop .7s cubic-bezier(.34, 1.56, .64, 1) 1.05s both; }
.spot-info { position: relative; z-index: 2; text-align: center; max-width: min(260px, 100%); overflow-wrap: anywhere; }
.spot-team { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 13px; }
.spot-name { font-family: var(--display); font-size: 24px; font-weight: 800; line-height: 1.05; margin-top: 4px; }
.spot-why { margin-top: 3px; color: var(--muted); font-size: 12px; }
.spot-line { display: flex; justify-content: center; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.spot-line span { padding: 4px 8px; border-radius: 8px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-size: 11px; color: #c9d6cd; }
.spot-line b { font-family: var(--display); font-size: 15px; color: var(--text); margin-right: 3px; }
.spot.play .spot-info { animation: fadeUp .6s ease-out 1.25s both; }
.spot-vs { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.spot-vs span { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--accent); box-shadow: 0 0 0 6px rgba(197, 243, 107, .08), 0 0 30px rgba(197, 243, 107, .25); }
.spot.play .spot-vs span { animation: vsPop .55s cubic-bezier(.34, 1.56, .64, 1) .9s both; }
.spot-vs small { color: var(--muted); font-size: 11px; font-weight: 700; text-align: center; max-width: 92px; }
@keyframes spin { from { transform: translate(-50%, -50%) rotate(0); } to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes breathe { 0%, 100% { opacity: .55; transform: translate(-50%, -50%) scale(.92); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } }
@keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 12% { opacity: .9; } 100% { transform: translateY(-230px) scale(1.15); opacity: 0; } }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-9px) rotate(.6deg); } }
@keyframes cardRise { 0% { opacity: 0; transform: translateY(50px) rotateY(80deg) scale(.84); } 62% { opacity: 1; transform: translateY(-8px) rotateY(-9deg) scale(1.04); } 100% { opacity: 1; transform: none; } }
@keyframes badgePop { 0% { opacity: 0; transform: translateX(-50%) scale(.3); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
@keyframes vsPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* presentación a pantalla completa */
.cine { position: fixed; z-index: 120; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; background: radial-gradient(70% 60% at 50% 45%, #163a1c, #040b07 75%); overflow: hidden; }
.cine-close { position: absolute; top: 16px; right: 16px; }
.cine-title { text-align: center; animation: cineTitle .8s cubic-bezier(.16, 1, .3, 1) both; }
.cine-title small { display: block; color: var(--accent); font-weight: 800; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; }
.cine-title strong { display: block; margin-top: 6px; font-family: var(--display); font-size: clamp(30px, 6vw, 58px); font-weight: 800; line-height: 1; letter-spacing: .02em; }
.cine-row { position: relative; display: flex; align-items: center; justify-content: center; gap: clamp(14px, 5vw, 70px); }
.cine-side { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.cine-left { animation: flyL 1s cubic-bezier(.16, 1, .3, 1) .7s both; }
.cine-right { animation: flyR 1s cubic-bezier(.16, 1, .3, 1) 1.15s both; }
.cine-vs { font-family: var(--display); font-size: clamp(40px, 8vw, 84px); font-weight: 800; color: var(--accent); text-shadow: 0 0 40px rgba(197, 243, 107, .6); animation: vsSlam .6s cubic-bezier(.34, 1.56, .64, 1) 1.8s both; }
.cine-flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, rgba(230, 255, 173, .75), transparent 45%); opacity: 0; animation: flash .9s ease-out 1.85s both; pointer-events: none; }
.cine-label { text-align: center; animation: fadeUp .6s ease-out 2.3s both; }
.cine-label b { display: block; font-family: var(--display); font-size: 22px; }
.cine-label span { color: var(--muted); font-size: 12px; }
.cine-foot { animation: fadeUp .6s ease-out 2.7s both; }
.cine .fut { --w: clamp(130px, 22vw, 240px); }
@keyframes cineTitle { from { opacity: 0; letter-spacing: .6em; } to { opacity: 1; } }
@keyframes flyL { from { opacity: 0; transform: translateX(-60vw) rotate(-14deg); } to { opacity: 1; transform: none; } }
@keyframes flyR { from { opacity: 0; transform: translateX(60vw) rotate(14deg); } to { opacity: 1; transform: none; } }
@keyframes vsSlam { from { opacity: 0; transform: scale(3); } to { opacity: 1; transform: scale(1); } }
@keyframes flash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- partidos ---------- */
.match-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.match { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); text-decoration: none; transition: border-color .15s, transform .15s; }
.match:hover { border-color: rgba(197, 243, 107, .35); transform: translateY(-2px); }
.match h3 { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.1; }
.match-meta { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
.match-meta div { display: flex; align-items: center; gap: 7px; }
.match-meta .ic { width: 15px; height: 15px; }
.match-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.price { font-family: var(--display); font-size: 22px; font-weight: 800; }
.price small { font-family: var(--body); color: var(--muted); font-size: 11px; font-weight: 600; margin-left: 3px; }
.cupos { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 5px; }
.versus { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.filters .input { width: auto; min-width: 150px; height: 40px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #c4d1c8; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

.detail-hero { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 22px; border-radius: 18px; background: linear-gradient(180deg, var(--raised), var(--panel)); border: 1px solid var(--line); }
.dh-team { display: flex; align-items: center; gap: 12px; }
.dh-team.right { justify-content: flex-end; text-align: right; }
.dh-team strong { display: block; font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1; }
.dh-team span { color: var(--muted); font-size: 12px; }
.dh-mid { text-align: center; }
.dh-mid b { display: block; font-family: var(--display); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1; }
.dh-mid span { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { position: relative; height: 42px; padding: 0 14px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 13px; white-space: nowrap; }
.tabs button.on { color: var(--text); }
.tabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }

.pitch-wrap { border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: #0d2a18; }
.pitch { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.pitch .ln { fill: none; stroke: rgba(255, 255, 255, .5); stroke-width: 2; }
.pitch .tok-c { stroke: rgba(0, 0, 0, .35); stroke-width: 2; }
.pitch .tok-t { font-family: var(--display); font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pitch .tok-n { font-family: var(--body); font-size: 10px; font-weight: 700; text-anchor: middle; fill: #fff; paint-order: stroke; stroke: rgba(0, 0, 0, .65); stroke-width: 3px; pointer-events: none; }
.pitch .tok-empty { fill: rgba(255, 255, 255, .06); stroke: rgba(255, 255, 255, .45); stroke-dasharray: 4 3; stroke-width: 1.5; }
.pitch .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: ring 1.8s ease-out infinite; }
.pitch .drag { cursor: grab; }
.pitch .drag:active { cursor: grabbing; }
.pitch .arrow { stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 6; }
@keyframes ring { 0% { transform: scale(1); opacity: .95; } 100% { transform: scale(1.9); opacity: 0; } }

.roster { display: flex; flex-direction: column; gap: 6px; }
.pl { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--raised); border: 1px solid transparent; }
.pl .pos { width: 36px; font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--muted); }
.pl .nm { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .ov { font-family: var(--display); font-weight: 800; font-size: 18px; }
.pl.figura { border-color: rgba(197, 243, 107, .45); background: linear-gradient(90deg, rgba(197, 243, 107, .14), var(--raised) 70%); animation: glowRow 2.4s ease-in-out infinite; }
.pl.free { border: 1px dashed var(--line-2); background: transparent; color: var(--muted); }
.crown { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.crown .ic { width: 12px; height: 12px; animation: bob 1.4s ease-in-out infinite; }
@keyframes glowRow { 0%, 100% { box-shadow: 0 0 0 0 rgba(197, 243, 107, 0); } 50% { box-shadow: 0 0 18px 0 rgba(197, 243, 107, .2); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

.chat { display: flex; flex-direction: column; height: 420px; }
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px; }
.msg { max-width: 82%; padding: 9px 12px; border-radius: 12px 12px 12px 4px; background: var(--raised); font-size: 13px; }
.msg small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; margin-bottom: 2px; }
.msg.me { align-self: flex-end; border-radius: 12px 12px 4px 12px; background: rgba(197, 243, 107, .14); }
.chat-form { display: flex; gap: 8px; }

/* ---------- pizarra ---------- */
.board-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- alquiler ---------- */
.list-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.rent { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.rent-top { display: flex; gap: 12px; align-items: center; }
.rent-ico { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: var(--raised-2); color: var(--accent); flex: 0 0 auto; }
.rent-ico .ic { width: 24px; height: 24px; }
.rent h3 { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1.1; }
.rent-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rent-stats div { padding: 8px; border-radius: 9px; background: var(--raised); text-align: center; }
.rent-stats b { display: block; font-family: var(--display); font-size: 19px; }
.rent-stats span { color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; font-size: 12px; font-weight: 700; color: #c9d6cd; }
.slot.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.slot:disabled { text-decoration: line-through; opacity: .4; cursor: not-allowed; }

/* ---------- pago ---------- */
.pay { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.steps { display: flex; gap: 8px; }
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--raised-2); }
.steps span.on { background: var(--accent); }
.method { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; border: 1.5px solid var(--accent); background: rgba(197, 243, 107, .06); }
.method-logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; background: #2d0b3d; color: #fff; font-weight: 800; font-size: 13px; }
.method.off { border-color: var(--line); background: transparent; opacity: .55; }
.sum-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.sum-row.total { border: 0; font-size: 15px; font-weight: 800; }
.sum-row.total b { font-family: var(--display); font-size: 28px; color: var(--accent); }
.phone { position: relative; width: 150px; height: 250px; margin: 6px auto 0; border-radius: 26px; border: 3px solid var(--line-2); background: var(--bg); display: flex; align-items: flex-start; justify-content: center; padding-top: 30px; }
.push { width: 128px; padding: 9px; border-radius: 12px; background: var(--raised-2); font-size: 10px; animation: pushIn 1.6s ease-in-out infinite; }
.push b { display: block; font-size: 11px; }
@keyframes pushIn { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--raised-2); border-top-color: var(--accent); animation: spin2 .9s linear infinite; }
@keyframes spin2 { to { transform: rotate(360deg); } }
.success-ico { display: grid; place-items: center; width: 74px; height: 74px; margin: 0 auto; border-radius: 50%; background: var(--accent); color: var(--accent-ink); animation: vsPop .5s cubic-bezier(.34, 1.56, .64, 1) both; }
.success-ico .ic { width: 38px; height: 38px; stroke-width: 2.6; }

/* ---------- ficha ---------- */
.profile-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; padding: 24px; border-radius: 18px; background: radial-gradient(90% 140% at 0% 0%, rgba(197, 243, 107, .1), transparent 55%), var(--panel); border: 1px solid var(--line); }
.attr-row { display: grid; grid-template-columns: 64px 1fr 34px; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: #c4d1c8; }
.attr-row b { font-family: var(--display); font-size: 18px; text-align: right; color: var(--text); }
.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 10px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); text-align: center; }
.badge-ico { display: grid; place-items: center; width: 52px; height: 52px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(160deg, var(--accent), #6f9b2c); color: var(--accent-ink); }
.badge-ico .ic { width: 24px; height: 24px; stroke-width: 2.2; }
.badge b { font-size: 12px; }
.badge span { font-size: 10px; color: var(--muted); }
.badge.locked .badge-ico { background: var(--raised-2); color: var(--dim); }
.badge.locked b { color: var(--muted); }
.spark { width: 100%; height: 120px; display: block; }
.hist { display: flex; flex-direction: column; }
.hist div { display: grid; grid-template-columns: 70px 1fr auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.hist div:last-child { border: 0; }
.res { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-weight: 800; font-size: 11px; }
.res.G { background: rgba(197, 243, 107, .18); color: var(--accent); }
.res.E { background: rgba(233, 196, 106, .16); color: var(--gold); }
.res.P { background: rgba(255, 122, 107, .16); color: var(--danger); }

/* ---------- equipos ---------- */
.club-hero { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 22px; border-radius: 18px; background: linear-gradient(120deg, rgba(197, 243, 107, .1), transparent 50%), var(--panel); border: 1px solid var(--line); }
.club-hero h1 { font-family: var(--display); font-size: 38px; font-weight: 800; line-height: 1; }
.club-stats { display: flex; gap: 22px; margin-left: auto; }
.club-stats div { text-align: center; }
.club-stats b { display: block; font-family: var(--display); font-size: 28px; line-height: 1; }
.club-stats span { color: var(--muted); font-size: 11px; font-weight: 700; }
.reto { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); }
.reto h3 { font-family: var(--display); font-size: 19px; font-weight: 700; }
.reto p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.mini-cards { display: flex; flex-wrap: wrap; gap: 14px; }
.mini-cards > div { position: relative; }
.mini-cards .crown { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); z-index: 2; }

/* ---------- torneos ---------- */
.cups { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.cup { padding: 16px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.cup.on { border-color: rgba(197, 243, 107, .45); }
.cup h3 { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.1; }
.bracket { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 26px; overflow-x: auto; padding-bottom: 6px; }
.round { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
.round h3 { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.bm { position: relative; border-radius: 11px; background: var(--raised); border: 1px solid var(--line); overflow: hidden; }
.bm.next { border-color: rgba(197, 243, 107, .5); box-shadow: 0 0 0 3px rgba(197, 243, 107, .07); }
.bm-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; }
.bm-row + .bm-row { border-top: 1px solid var(--line); }
.bm-row .sc { margin-left: auto; font-family: var(--display); font-size: 18px; font-weight: 800; }
.bm-row.win { color: var(--text); } .bm-row.lose { color: var(--muted); }
.bm-tag { padding: 5px 10px; font-size: 10px; font-weight: 700; color: var(--accent); background: rgba(197, 243, 107, .07); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 9px 8px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.me td { background: rgba(197, 243, 107, .06); }
td.pts { font-family: var(--display); font-size: 18px; font-weight: 800; color: var(--accent); }
.form-pills { display: flex; gap: 3px; }
.form-pills .res { width: 20px; height: 20px; font-size: 10px; }
.zone-line { display: inline-block; width: 3px; height: 18px; border-radius: 2px; margin-right: 8px; vertical-align: middle; }

/* ---------- post-partido ---------- */
.score-hero { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 22px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
.score-hero .sc { font-family: var(--display); font-size: 54px; font-weight: 800; line-height: 1; text-align: center; }
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.vote { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raised); text-align: left; }
.vote.on { border-color: var(--accent); background: rgba(197, 243, 107, .1); }
.vote .nm { font-weight: 700; font-size: 13px; }
.vote small { display: block; color: var(--muted); font-size: 11px; }
.vote-res { display: grid; grid-template-columns: 150px 1fr 30px; gap: 10px; align-items: center; font-size: 12px; font-weight: 600; }
.vote-res .bar { height: 10px; }
.vote-res .bar i { width: 0; transition: width 1.1s cubic-bezier(.16, 1, .3, 1); }
.ovr-up { display: flex; flex-wrap: wrap; align-items: center; gap: 26px; }
.delta { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; background: rgba(197, 243, 107, .16); color: var(--accent); font-weight: 800; font-size: 12px; animation: badgePopS .6s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes badgePopS { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
.mvp-reveal { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }
.mvp-reveal .spot-card { animation: cardRise 1.15s cubic-bezier(.16, 1, .3, 1) both; }

/* ---------- registro ---------- */
.reg { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.reg-preview { position: sticky; top: calc(var(--top) + 20px); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px 18px; border-radius: 18px; background: radial-gradient(80% 70% at 50% 30%, rgba(197, 243, 107, .14), transparent 70%), var(--panel); border: 1px solid var(--line); }
.pos-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pos-btn { height: 52px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--raised); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); font-size: 18px; font-weight: 800; }
.pos-btn small { font-family: var(--body); font-size: 9px; font-weight: 600; color: var(--muted); }
.pos-btn.on { border-color: var(--accent); background: rgba(197, 243, 107, .12); color: var(--accent); }
.slider { display: grid; grid-template-columns: 80px 1fr 36px; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; }
.slider input { width: 100%; accent-color: var(--accent); }
.slider b { font-family: var(--display); font-size: 20px; text-align: right; }

/* ---------- modal / toast ---------- */
.modal-bg { position: fixed; z-index: 100; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(2, 8, 5, .7); backdrop-filter: blur(4px); }
.modal { width: min(480px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line-2); animation: fadeUp .25s ease-out both; }
.modal h2 { font-family: var(--display); font-size: 26px; font-weight: 800; }
.toast { position: fixed; z-index: 130; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); animation: fadeUp .25s ease-out both; max-width: calc(100vw - 32px); }
.notif { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.notif:last-child { border: 0; }
.notif .rent-ico { width: 38px; height: 38px; border-radius: 10px; }
.notif .rent-ico .ic { width: 18px; height: 18px; }

/* ---------- móvil ---------- */
@media (max-width: 1080px) {
  .g-main, .pay, .reg { grid-template-columns: minmax(0, 1fr); }
  .reg-preview { position: static; }
  .cups { grid-template-columns: 1fr 1fr; }
  .badges { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  :root { --top: 58px; }
  .topbar { padding: 0 12px; gap: 10px; }
  .menu-btn { display: grid; }
  .top-search, .me-chip .me-name { display: none; }
  .brand-name { font-size: 19px; }
  .sidebar { z-index: 60; width: min(290px, calc(100vw - 50px)); transform: translateX(-105%); transition: transform .22s ease; }
  .sidebar.open { transform: none; }
  .scrim.open { display: block; position: fixed; z-index: 55; inset: 0; background: rgba(0, 0, 0, .55); }
  .main { margin-left: 0; padding: calc(var(--top) + 16px) 14px calc(96px + env(safe-area-inset-bottom)); }
  .view { gap: 16px; }
  .page-head h1 { font-size: 32px; }
  .tabbar { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); background: rgba(9, 23, 16, .97); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--dim); font-size: 10px; font-weight: 700; text-decoration: none; }
  .tab.active { color: var(--accent); }
  .tab .ic { width: 22px; height: 22px; }
  .tab.fab span:first-child { display: grid; place-items: center; width: 50px; height: 50px; margin-top: -24px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 22px rgba(197, 243, 107, .3); }
  .g-2, .g-3, .cups { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .spot { padding: 16px 12px 18px; }
  .spot-head h2 { font-size: 23px; }
  .spot-stage { grid-template-columns: 1fr 1fr; gap: 8px 6px; }
  .spot-vs { grid-column: 1 / -1; grid-row: 1; flex-direction: row; justify-content: center; }
  .spot-vs span { width: 46px; height: 46px; font-size: 19px; }
  .spot-vs small { max-width: none; }
  .spot .fut.lg { --w: min(150px, 40vw); }
  .spot-rays { width: 280px; height: 280px; }
  .spot-glow { width: 160px; height: 160px; }
  .spot-name { font-size: 18px; }
  .spot-team { font-size: 11px; }
  .spot-why { font-size: 11px; }
  .spot-line span { padding: 3px 6px; font-size: 10px; }
  .spot-line b { font-size: 13px; }
  .detail-hero, .score-hero { grid-template-columns: 1fr; text-align: center; padding: 18px; }
  .dh-team, .dh-team.right { justify-content: center; text-align: center; flex-direction: column; }
  .score-hero .sc { font-size: 44px; }
  .profile-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 20px 16px; }
  .club-stats { margin-left: 0; width: 100%; justify-content: space-around; }
  .badges { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reto { grid-template-columns: auto minmax(0, 1fr); }
  .reto > :last-child { grid-column: 1 / -1; }
  .pos-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }

/* ================= ciudades ================= */
.city-seg button { display: inline-flex; align-items: center; gap: 6px; }

/* ================= v2: nuevas piezas ================= */
.quiet .spot-card, .quiet .figura-badge, .quiet .spot-info, .quiet .spot-vs span, .quiet .totw-card, .quiet .delta, .quiet .success-ico { animation: none !important; }
.online { display: none; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 99px; border: 1px solid rgba(197, 243, 107, .25); color: #d3efab; font-size: 11px; font-weight: 700; }
.online.on { display: inline-flex; }
.online::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(197, 243, 107, .18); }
.side-user { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 11px; color: var(--muted); }

/* cara a cara */
.h2h { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 18px; align-items: center; }
.radar { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
.radar .grid-l { fill: none; stroke: rgba(218, 241, 225, .1); }
.radar .axis-t { fill: var(--muted); font-size: 11px; font-weight: 700; font-family: var(--body); }
.radar .hit { fill: transparent; cursor: help; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 18px; height: 0; border-top: 3px solid; border-radius: 2px; }
.sw.dash { border-top-style: dashed; }
.h2h-table { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 14px; align-items: center; font-size: 13px; }
.h2h-table .hd { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.h2h-table b { font-family: var(--display); font-size: 19px; text-align: right; min-width: 28px; }
.h2h-table b.win { color: var(--text); }
.h2h-table b.lose { color: var(--dim); }
.h2h-sum { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* predicciones */
.pick3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pick3 button { min-height: 52px; padding: 6px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--raised); font-weight: 700; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.pick3 button small { color: var(--muted); font-size: 10px; font-weight: 600; }
.pick3 button.on { border-color: var(--accent); background: rgba(197, 243, 107, .12); color: var(--accent); }
.score-in { display: flex; align-items: center; gap: 10px; }
.score-in input { width: 70px; text-align: center; font-family: var(--display); font-size: 22px; font-weight: 800; }
.dist { display: flex; gap: 2px; height: 12px; border-radius: 99px; overflow: hidden; }
.dist i { display: block; height: 100%; }
.dist i:first-child { border-radius: 99px 0 0 99px; } .dist i:last-child { border-radius: 0 99px 99px 0; }
.dist-l { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.dist-l b { color: var(--text); font-variant-numeric: tabular-nums; }
.pred-own { padding: 12px; border-radius: 10px; background: rgba(197, 243, 107, .07); border: 1px solid rgba(197, 243, 107, .25); font-size: 13px; }

.totw-pitch { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 22px 10px; border-radius: 18px; border: 1px solid rgba(233, 196, 106, .3); background: radial-gradient(60% 40% at 50% 0%, rgba(233, 196, 106, .14), transparent 70%), repeating-linear-gradient(180deg, #123520 0 64px, #15402a 64px 128px); overflow: hidden; }
.totw-pitch::before { content: ""; position: absolute; inset: 14px; border: 2px solid rgba(255, 255, 255, .22); border-radius: 6px; pointer-events: none; }
.totw-pitch::after { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; border-top: 2px solid rgba(255, 255, 255, .22); pointer-events: none; }
.totw-row { position: relative; z-index: 1; display: flex; justify-content: center; gap: clamp(8px, 3vw, 34px); flex-wrap: wrap; }
.totw-card { display: flex; flex-direction: column; align-items: center; gap: 6px; animation: dropIn .7s cubic-bezier(.34, 1.56, .64, 1) both; }
.totw-card .nm { font-size: 12px; font-weight: 700; text-align: center; max-width: 130px; }
.fut.totw { --card-bg: radial-gradient(110% 70% at 70% 15%, rgba(233, 196, 106, .4), transparent 55%), linear-gradient(165deg, #3a2c08 0%, #0b0904 46%, #1a1405 72%, #e9c46a 140%); --card-ink: #ffe9a8; --card-edge: #e9c46a; --num-ink: #1a1405; }
.fut.totw::after { content: ""; position: absolute; inset: 0; background: linear-gradient(112deg, transparent 32%, rgba(255, 240, 200, .45) 45%, rgba(233, 196, 106, .3) 51%, transparent 64%); background-size: 260% 100%; background-position: 150% 0; mix-blend-mode: screen; pointer-events: none; animation: holo 3.8s ease-in-out infinite; }

/* check-in y reputación */
.qr { display: grid; place-items: center; width: 172px; height: 172px; padding: 10px; border-radius: 14px; background: #fff; flex: 0 0 auto; }
.qr img, .qr canvas { width: 152px !important; height: 152px !important; }
.qr-fallback { color: #07130f; font-family: var(--display); font-weight: 800; font-size: 22px; text-align: center; }
.rep { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

/* balanceo */
.balance-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.shuffle .pl { animation: fadeUp .45s ease-out both; }
.shuffle .pl:nth-child(2) { animation-delay: .05s; } .shuffle .pl:nth-child(3) { animation-delay: .1s; } .shuffle .pl:nth-child(4) { animation-delay: .15s; } .shuffle .pl:nth-child(5) { animation-delay: .2s; } .shuffle .pl:nth-child(n+6) { animation-delay: .25s; }

/* mapa */
.map { width: 100%; height: auto; display: block; border-radius: 14px; border: 1px solid var(--line); background: #0a1a12; }
.map .road { stroke: rgba(218, 241, 225, .14); stroke-width: 6; fill: none; stroke-linecap: round; }
.map .road-t { fill: var(--dim); font-size: 10px; font-family: var(--body); font-weight: 600; }
.map .zone-t { fill: var(--text); font-size: 13px; font-family: var(--body); font-weight: 700; paint-order: stroke; stroke: #0a1a12; stroke-width: 4px; }
.map .pin { cursor: pointer; }
.map .pin circle.dotp { fill: var(--accent); stroke: #0a1a12; stroke-width: 3; }
.map .pin text { fill: var(--accent-ink); font-family: var(--display); font-weight: 800; font-size: 14px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map .pin.off circle.dotp { fill: #4d6356; }
.map .pin:focus-visible circle.dotp, .map .pin:hover circle.dotp { stroke: var(--text); }

/* panel de cancha */
.week { display: grid; grid-template-columns: 78px repeat(7, minmax(64px, 1fr)); gap: 4px; min-width: 620px; }
.week .h { font-size: 11px; font-weight: 800; color: var(--muted); text-align: center; padding: 6px 0; }

.cell { height: 38px; border-radius: 7px; border: 1px solid var(--line-2); background: transparent; font-size: 10px; font-weight: 700; color: var(--dim); }
.cell.bk { background: rgba(197, 243, 107, .2); border-color: rgba(197, 243, 107, .4); color: var(--accent); }
.cell.bl { background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .06) 0 6px, transparent 6px 12px); color: var(--muted); }
.cell:hover { border-color: var(--text); }
.bars { width: 100%; height: auto; display: block; }
.bars .gl { stroke: rgba(218, 241, 225, .08); }
.bars .tx { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.bars .b { fill: var(--accent); }
.bars .b:hover { fill: #dcff95; }
.legend-k { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 10px; }
.legend-k span { display: inline-flex; align-items: center; gap: 6px; }
.legend-k i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line-2); }

@media (max-width: 860px) {
  .h2h { grid-template-columns: minmax(0, 1fr); }

  .totw-pitch .fut.sm { --w: min(100px, 27vw); }

}

/* ================= v4: marcador, notas, mercado, galería, niveles ================= */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 26px 20px; border-radius: 18px; border: 1px solid rgba(197, 243, 107, .25); background: radial-gradient(70% 120% at 50% 0%, rgba(197, 243, 107, .12), transparent 60%), linear-gradient(180deg, #0d2116, #08150f); color: #eef5f0; }
.sb-team { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.sb-team strong { font-family: var(--display); font-size: 26px; line-height: 1.05; }
.sb-mid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.sb-score { font-family: var(--display); font-size: 84px; font-weight: 800; line-height: .9; letter-spacing: .02em; }
.sb-score span { color: #91a399; margin: 0 .15em; }
.sb-clock { font-family: var(--display); font-size: 30px; font-weight: 700; color: #c5f36b; padding: 2px 14px; border-radius: 10px; background: rgba(0, 0, 0, .3); }
.live-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .2; } }
.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 42px 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.tl:last-child { border: 0; }
.tl-min { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--accent); }
.tl.away .tl-min { color: var(--info); }
.rate-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--raised); }
.rate-row input { width: 100%; accent-color: var(--accent); }
.goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.goal { border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.goal.lead { border-color: rgba(197, 243, 107, .45); }
.goal-media { position: relative; aspect-ratio: 16 / 9; background: #000; }
.goal-media img, .goal-media video, .goal-media svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.lvl { padding: 2px 7px; border-radius: 99px; background: rgba(197, 243, 107, .14); color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .04em; }
details summary::-webkit-details-marker { display: none; }
@media (max-width: 860px) {
  .scoreboard { grid-template-columns: 1fr 1fr; padding: 18px 12px; }

function makeTeam(id, name, c1, c2, mode, formation, roster) {
  const slots = FORMATIONS[mode][formation];
  const r = rng(hash(id + "roster"));
  const ids = roster || slots.map((s, i) => {
    const pid = `${id}-${i}`;
    addPlayer({ id: pid, name: `${FIRST[Math.floor(r() * FIRST.length)]} ${LAST[Math.floor(r() * LAST.length)]}`, pos: s[2], ovr: 66 + Math.floor(r() * 17), num: s[2] === "POR" ? 1 : 2 + i + Math.floor(r() * 3) * 7, team: id });

  });
  ids.forEach(pid => { if (PLAYERS[pid]) PLAYERS[pid].team = id; });

}

/* ================= reglas: figura de cada equipo ================= */
function figuraScore(p) { return p.ovr * .4 + p.form.rating * 6 + p.form.mvp * 2.5 + (p.boost || 0); }
function activeRoster(teamId, m) {
  const t = TEAMS[teamId];
  if (!m || m.home === "parceros") return t.roster;
  const homeCount = Math.ceil(m.filled / 2);
  const count = teamId === m.home ? homeCount : m.filled - homeCount;
  const act = t.roster.slice(0, count);
  if (t.roster.includes("me") && !act.includes("me") && act.length) act[act.length - 1] = "me";
  return act;
}
function figuraOf(teamId, m) {
  const ids = activeRoster(teamId, m);
  return ids.map(id => PLAYERS[id]).sort((a, b) => figuraScore(b) - figuraScore(a))[0];
}
function figuraReason(p) {
  if (p.boost) return "MVP votado en su último partido";
  if (p.form.mvp >= 5) return `${p.form.mvp} veces MVP esta temporada`;
  if (p.form.rating >= 7.8) return `Mejor nota promedio del equipo (${p.form.rating.toFixed(1)})`;
  return "Mejor forma en sus últimos 5 partidos";
}
const nextMatch = () => MATCHES.find(m => m.joined && !m.created) || MATCHES[0];

function runCounts(root = document) {
  $$("[data-count]", root).forEach(el => {
    const end = +el.dataset.count; if (reduced || quiet) { el.textContent = end; return; }
    const start = Math.max(0, end - 40), t0 = performance.now() + 350, dur = 1300;
    el.textContent = start;
    const step = now => { const k = clamp((now - t0) / dur, 0, 1); el.textContent = Math.round(start + (end - start) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };

  });
}

function lineupSVG(m) {
  let out = pitchLines();

    const t = TEAMS[tid], slots = FORMATIONS[t.mode][t.formation], active = activeRoster(tid, m), fig = figuraOf(tid, m);
    slots.forEach((s, i) => {
      const x = side ? 680 - s[0] : s[0], y = side ? 440 - s[1] : s[1];
      const pid = t.roster[i], filled = active.includes(pid);
      out += token(x, y, PLAYERS[pid], t, { figura: filled && fig && fig.id === pid, empty: !filled });

  else if (h.startsWith("vivo-") && MATCHES.some(m => m.id === h.slice(5))) html = viewVivo(h.slice(5));
  else if (h.startsWith("notas-") && MATCHES.some(m => m.id === h.slice(6))) html = viewNotas(h.slice(6));
  else if (VIEWS[h]) html = VIEWS[h]();
  else html = VIEWS.inicio();
  $("#view").innerHTML = html;
  $("#view").classList.toggle("quiet", quiet);
  renderChrome();
  markNav(VIEWS[h] || /^(partido|vivo|notas)-/.test(h) ? h : "inicio");

  after.forEach(fn => fn());

}

function bindBoard() {
  const svg = $("#board"); if (!svg) return;
  const b = state.board; let drag = null, line = null, start = null;
  const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener("pointerdown", e => {
    const p = pt(e);
    const g = e.target.closest(".drag");
    if (b.tool === "mover" && g) { drag = { g, i: +g.dataset.i }; svg.setPointerCapture(e.pointerId); e.preventDefault(); }
    else if (b.tool === "flecha") { start = p; line = document.createElementNS("http://www.w3.org/2000/svg", "line"); line.setAttribute("class", "arrow"); line.setAttribute("marker-end", "url(#ah)"); ["x1", "x2"].forEach(k => line.setAttribute(k, p.x)); ["y1", "y2"].forEach(k => line.setAttribute(k, p.y)); $("#arrows").appendChild(line); svg.setPointerCapture(e.pointerId); e.preventDefault(); }
  });
  svg.addEventListener("pointermove", e => {
    if (!drag && !line) return; const p = pt(e);
    if (drag) { const x = clamp(p.x, 20, 660), y = clamp(p.y, 20, 420); drag.g.setAttribute("transform", `translate(${x} ${y})`); b.tokens[drag.i].x = x; b.tokens[drag.i].y = y; }
    if (line) { line.setAttribute("x2", p.x); line.setAttribute("y2", p.y); }
  });
  const end = () => {
    if (line) { const x2 = +line.getAttribute("x2"), y2 = +line.getAttribute("y2"); if (Math.hypot(x2 - start.x, y2 - start.y) > 18) b.arrows.push([start.x, start.y, x2, y2].map(v => Math.round(v))); else line.remove(); }
    drag = null; line = null;
  };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
}

function votesNow() {
  const v = Object.assign({}, PRESET_VOTES);
  if (state.vote.done && state.vote.selected) v[state.vote.selected] = (v[state.vote.selected] || 0) + 1;
  return v;
}

        <div class="stack" style="gap:8px">${ranked.map(([id, n]) => `<div class="vote-res"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(PLAYERS[id].name)}</span><span class="bar"><i data-w="${n / maxV * 100}%"></i></span><b class="num">${n}</b></div>`).join("")}</div>

const ACTIONS = {
  menu() { const open = !$("#sidebar").classList.contains("open"); $("#sidebar").classList.toggle("open", open); $("#scrim").classList.toggle("open", open); $("#menuBtn").setAttribute("aria-expanded", String(open)); },
  "close-drawer": closeDrawer,
  city(el) {
    const cy = el.dataset.val; if (!CITIES.includes(cy) || cy === state.city) return;
    state.city = cy; state.filters.zone = "Todas"; state.rentZone = "Todas";
    try { localStorage.setItem("gm-city", cy); } catch (e) { }
    rerender(); toast(`Mostrando partidos, canchas y arqueros de ${cy}`);
  },
  "close-modal": closeModal,
  "close-modal-bg"(el, e) { if (e.target === el) closeModal(); },
  replay(el) { const s = el.closest("[data-spot]"); s.classList.remove("play"); void s.offsetWidth; s.classList.add("play"); runCounts(s); },
  present(el) { present(el.dataset.match); },

    openModal(`<div class="row between"><h2>Notificaciones</h2><button class="icon-btn" type="button" data-act="close-modal" aria-label="Cerrar">${ic("x")}</button></div>

  join(el) { const m = MATCHES.find(x => x.id === el.dataset.match); state.cart = { type: "cupo", matchId: m.id, title: "Cupo · " + m.title, detail: `${m.day} · ${m.time} · ${m.venue}`, amount: m.price }; state.pay = { step: 1, phone: state.pay.phone, ref: "", error: "" }; go("pago"); },

const cloud = { db: null, user: null, downloads: null, uid: null, ready: false, canWrite: true, players: {}, votes: {}, preds: {}, chat: [], matches: [], names: {}, myName: "" };

const pendingKinds = new Set();
const currentView = () => decodeURIComponent(location.hash.slice(1)) || "inicio";
const RELEVANT = {

  votes: v => ["post-partido", "inicio", "equipo-semana"].includes(v) || v.startsWith("partido-"),

    if (busy) { if (kinds.includes("chat") && $("#chatLog")) { $("#chatLog").innerHTML = chatHTML(view.slice(8)); $("#chatLog").scrollTop = 1e6; } return; }
    quiet = true; try { rerender(); } finally { quiet = false; }
  }, 350);
}
function cleanPlayer(d) {

  const pos = POSITIONS.some(p => p[0] === d.pos) ? d.pos : "MC";

  return { name, nick: String(d.nick || "").slice(0, 16), pos, num: clamp(Math.round(+d.num || 10), 1, 99), attrs, zone: ZONES.includes(d.zone) ? d.zone : "Chapinero", city: CITIES.includes(d.city) ? d.city : cityOfZone(d.zone), short: lastName(name).toUpperCase(), ovr: calcOvr(attrs, pos) };
}
function displayName(uid) {

function askNames(ids) {
  if (!cloud.user || typeof cloud.user.profiles !== "function") return;
  const need = [...new Set(ids)].filter(id => id && !(id in cloud.names)); if (!need.length) return;
  need.forEach(id => { cloud.names[id] = ""; });

const adopted = { p: false, v: false, pr: false };
function adoptOwn() {
  const id = cloud.uid; if (!id) return;
  if (!adopted.p && cloud.players[id]) {
    adopted.p = true; const d = cleanPlayer(cloud.players[id]);
    Object.assign(state.profile, { name: d.name, nick: d.nick, pos: d.pos, num: d.num, attrs: d.attrs, zone: d.zone, city: d.city }); syncMe(); saveProfile();
  }
  if (!adopted.v && cloud.votes[id] && PLAYERS[cloud.votes[id].player] && !state.vote.done) {
    adopted.v = true; state.vote.selected = cloud.votes[id].player; state.vote.done = true;
    if (!state.ovrApplied) { state.ovrApplied = true; state.ovrDeltas = { REG: 2, PAS: 1, TIR: 1 }; state.attrsBefore = Object.assign({}, state.profile.attrs); Object.entries(state.ovrDeltas).forEach(([k, dl]) => { state.attrsBefore[k] = state.profile.attrs[k] - dl; }); state.ovrBefore = calcOvr(state.attrsBefore, state.profile.pos); }

function pushProfile() {
  if (!cloud.ready || !cloud.uid || !cloud.canWrite) return Promise.resolve();
  const p = state.profile;
  return cloud.db.doc("players/" + cloud.uid).set({ name: p.name, nick: p.nick || "", pos: p.pos, num: +p.num || 10, attrs: Object.assign({}, p.attrs), zone: p.zone || "Chapinero", city: CITIES.includes(p.city) ? p.city : cityOfZone(p.zone), ts: Date.now() })
    .catch(e => { if (e && e.code === "invalid_argument") cloud.canWrite = false; if (e && e.code === "quota_exceeded") toast("La base de datos está llena. Avísale al dueño de la app."); });
}
function cloudWrite(path, data) {

function mergeCloudMatches() {
  cloud.matches.forEach(d => {

    const total = MODE_SIZE[d.mode] * 2;
    const m = { id: d.id, mode: d.mode, title: String(d.title || "Partido").slice(0, 60), kind: d.uid === cloud.uid ? "Creado por ti" : "Creado por la comunidad", day: String(d.day || "").slice(0, 30), time: String(d.time || "").slice(0, 20), venue: String(d.venue || "").slice(0, 60), zone: ZONES.includes(d.zone) ? d.zone : "Chapinero", price: clamp(Math.round(+d.price || 0), 0, 500000), total, filled: clamp(Math.round(+d.filled || 1), 1, total), level: ["Recreativo", "Intermedio", "Competitivo"].includes(d.level) ? d.level : "Intermedio", joined: d.uid === cloud.uid, paid: false, created: true }; m.city = CITIES.includes(d.city) ? d.city : cityOfZone(m.zone);

async function initCloud() {
  if (!window.claude || typeof window.claude.use !== "function") return;

  let db = null, user = null;

  try { cloud.uid = user ? await user.id() : null; } catch (e) { }

  listen(db.collection("votes"), s => { cloud.votes = toMap(s); adoptOwn(); cloudChanged("votes"); }, "votes");
  listen(db.collection("preds"), s => { cloud.preds = toMap(s); adoptOwn(); askNames(Object.keys(cloud.preds)); cloudChanged("preds"); }, "preds");
  listen(db.collection("chat").orderBy("ts", "asc").limit(600), s => { cloud.chat = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); askNames(cloud.chat.map(c => c.uid)); cloudChanged("chat"); }, "chat");

  listen(db.collection("ratings"), s => { cloud.ratings = toMap(s); const mine = cloud.ratings[cloud.uid]; if (mine && mine.byMatch && !adopted.rt) { adopted.rt = true; Object.entries(mine.byMatch).forEach(([mid, v]) => { if (v && typeof v === "object" && !state.ratings[mid]) { const o = {}; Object.entries(v).forEach(([pid, n]) => { if (PLAYERS[pid] && +n >= 1 && +n <= 10) o[pid] = +n; }); state.ratings[mid] = o; } }); } cloudChanged("ratings"); }, "ratings");

/* ================= balanceo automático ================= */
state.balanced = {};
const avgOvr = ids => ids.length ? ids.reduce((s, id) => s + PLAYERS[id].ovr, 0) / ids.length : 0;
function balanceMatch(m) {
  const A = TEAMS[m.home], B = TEAMS[m.away], actA = activeRoster(A.id, m), actB = activeRoster(B.id, m);
  const all = actA.concat(actB), capA = actA.length, capB = actB.length, before = Math.abs(avgOvr(actA) - avgOvr(actB));
  const keepers = all.filter(id => PLAYERS[id].pos === "POR"), rest = all.filter(id => PLAYERS[id].pos !== "POR").sort((a, b) => PLAYERS[b].ovr - PLAYERS[a].ovr);
  const ta = [], tb = []; let sa = 0, sb = 0;
  keepers.concat(rest).forEach(id => { const o = PLAYERS[id].ovr; const toA = ta.length < capA && (tb.length >= capB || sa / capA <= sb / capB); if (toA) { ta.push(id); sa += o; } else { tb.push(id); sb += o; } });
  const diff = () => Math.abs(avgOvr(ta) - avgOvr(tb)), isK = id => PLAYERS[id].pos === "POR";
  for (let it = 0, improved = true; improved && it < 60; it++) {
    improved = false; let best = diff(), bi = -1, bj = -1;
    ta.forEach((a, i) => tb.forEach((b, j) => { if (isK(a) !== isK(b)) return; [ta[i], tb[j]] = [b, a]; const d = diff(); if (d < best - 1e-9) { best = d; bi = i; bj = j; } [ta[i], tb[j]] = [a, b]; }));
    if (bi >= 0) { [ta[bi], tb[bj]] = [tb[bj], ta[bi]]; improved = true; }
  }
  if (diff() > before) { ta.length = 0; tb.length = 0; actA.forEach(x => ta.push(x)); actB.forEach(x => tb.push(x)); }
  ta.sort((a, b) => isK(b) - isK(a)); tb.sort((a, b) => isK(b) - isK(a));
  const restA = A.roster.filter(id => !all.includes(id)), restB = B.roster.filter(id => !all.includes(id));
  A.roster = ta.concat(restA); B.roster = tb.concat(restB);
  ta.forEach(id => { if (id !== "me") PLAYERS[id].team = A.id; }); tb.forEach(id => { if (id !== "me") PLAYERS[id].team = B.id; });
  const after = Math.abs(avgOvr(ta) - avgOvr(tb));
  state.balanced[m.id] = { before, after };
}
